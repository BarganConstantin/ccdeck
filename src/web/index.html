<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ccdeck</title>
    <!-- The resting pair, and only the resting pair. Both are parsed before any
         module runs, so this is the deck at boot — nothing waiting, nothing
         known to be running — and App.tsx's ambient effect corrects both within
         the first frame it has state for. The title is the one copy of the name
         that no constant can reach (display-name.test.ts pins it to PRODUCT).
         The icons are the brand kit's 05-web files, linked as the kit links
         them: the ICO for a browser without SVG favicons, the SVG every other
         browser shows, and the home-screen icon for iOS. use-tab-ambient.ts
         swaps both icon links to the kit's state files. The ICO says 32x32,
         never `any`: with `any`, Chrome shows the ICO and keeps it after the
         SVG's href changes, so the tab would never show a state
         (ambient-signal.test.ts holds it). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Installed, this deck is an application: a Dock tile on macOS, a taskbar
         and Start entry on Windows, a .desktop file in the launcher on Linux —
         which is the one that matters most, because a launcher entry works on
         Hyprland and Sway, where the system tray people ask for instead does
         not exist. Chrome and Edge draw their own install control in the
         address bar once this parses; Safari's File ▸ Add to Dock needs no
         manifest but takes the name and icons from one. So the deck adds no UI
         of its own for this, and has nothing to nag about.
         The server withdraws this file when the port was invented rather than
         chosen — an installed app is pinned to an origin, and an origin
         includes the port. See src/server/app-manifest.mjs. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The standalone window's title bar. The value here is the dark theme's
         --panel, which is what a deck with nothing stored paints; App.tsx's
         theme effect rewrites it from the sheet on every flip, because the
         theme is a stored choice and a media-queried pair would follow the OS
         past it. -->
    <meta name="theme-color" content="#14161b" />
    <!-- The theme, before the first frame rather than after it.
         styles.css keys every colour off :root[data-theme=…] and reads a
         missing attribute as dark, so a light-theme user whose preference is
         applied by a React effect watches a fully painted dark deck first —
         native scrollbars and form controls included, because that block also
         declares color-scheme: dark. The bundle cannot fix this: it is a module
         script, so it is deferred and the paint can happen while it is still
         being fetched. This is a classic inline script, which means the parser
         stops here, inside <head>, before any frame exists — and it is what
         Vite leaves untouched in the built HTML (it rewrites only scripts with
         a src or type="module"). Deliberately dependency-free, and kept honest
         against resolveTheme() in theme.ts by theme-first-paint.test.ts, which
         runs this exact text. With nothing stored, the OS decides (#885). -->
    <script>
      (function () {
        var stored = null, light = false;
        // `window.localStorage` is a GETTER that throws where site data is
        // blocked, so the property read is inside the try, not just getItem.
        // A refused store must cost a preference and never the boot.
        try { stored = window.localStorage.getItem("agent-dag.theme"); } catch (e) {}
        // No choice stored: follow the OS. Guarded the same way, because an
        // embed without matchMedia must not stop the parse either.
        try { light = window.matchMedia("(prefers-color-scheme: light)").matches; } catch (e) {}
        document.documentElement.setAttribute("data-theme",
          stored === "light" || stored === "dark" || stored === "rider-black" || stored === "vscode-black" ? stored : light ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
