<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" role="img" aria-label="Several Claude accounts: switch between them, add one, share one to another machine." class="guide-art" viewBox="0 0 440 200"><style>:root{--bg:#0b0c10;--bg-soft:#0f1116;--panel:#14161b;--line:#1f2229;--line-soft:#1a1c22;--text:#d8dae0;--text-secondary:#9aa0ab;--ctl-fill:color-mix(in srgb, var(--text) 7%, transparent);--ctl-edge:color-mix(in srgb, var(--text) 50%, transparent);--sm-edge:color-mix(in srgb, var(--text) 36%, transparent);--sm-fill:color-mix(in srgb, var(--text) 5%, transparent);--muted:#7e828c;--muted-dim:#50535b;--text-dim:#7e828c;--accent:#7dd3fc;--accent-dim:#38bdf850;--ok:#86efac;--warn:#fcd34d;--err:#fca5a5;--inflight:#f0abfc;--shadow-1:0 6px 18px rgba(0,0,0,0.25);--shadow-2:0 10px 24px rgba(0,0,0,0.32);--node-grad:linear-gradient(180deg, var(--panel), var(--bg-soft));--topbar-grad:linear-gradient(to bottom, var(--panel), var(--bg-soft));--bg-grid-1:rgba(125,211,252,0.06);--bg-grid-2:rgba(240,171,252,0.05);--grid-line:#1a1d24;--minimap-mask:rgba(11,12,16,0.85);--mcp-dot-l:65%}svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg)}.guide-art { display: block; width: 100%; height: auto; overflow: visible; }
.ga-screen { fill: var(--panel); stroke: color-mix(in srgb, var(--text) 16%, transparent); }
.ga-canvas { fill: none; stroke: color-mix(in srgb, var(--text) 16%, transparent); stroke-dasharray: 3 5; }
.ga-line { stroke: color-mix(in srgb, var(--text) 12%, transparent); }
.ga-track { fill: color-mix(in srgb, var(--text) 12%, transparent); }
.ga-bed-warn { fill: color-mix(in srgb, var(--warn) 10%, transparent); }
.ga-t { font-size: 11px; fill: var(--text); }
.ga-s { font-size: 10px; fill: var(--muted); }
.ga-cap { font-size: 9px; font-weight: 600; letter-spacing: 0.06em; fill: var(--muted); }
.ga-big { font-size: 26px; font-weight: 600; fill: var(--text); }
.ga-strong { font-weight: 600; }
.ga-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.ga-ok { fill: var(--ok); }
.ga-warn { fill: var(--warn); }
.ga-accent { fill: var(--accent); }
.ga-flight { fill: var(--inflight); }
.ga-dim { fill: var(--muted-dim); }
.ga-switch { fill: var(--ctl-fill); stroke: var(--ctl-edge); }
.ga-switch-on { fill: var(--accent); }
.ga-knob { fill: var(--muted); }
.ga-knob-on { fill: var(--bg); }
.ga-box { fill: none; stroke: var(--muted); }
.ga-tick { fill: none; stroke: var(--bg); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ga-pointer { fill: var(--text); stroke: var(--bg); stroke-width: 1; stroke-linejoin: round; }
.ga-pill-warn { fill: none; stroke: var(--warn); }
.ga-off { stroke: var(--muted-dim); stroke-width: 1.2; stroke-dasharray: 2 5; }
.ga-arc { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-dasharray: 3 4; }
.ga-arrow { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.ga-edge { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.ga-edge-done { fill: none; stroke: var(--muted-dim); stroke-width: 1.2; }
.ga-chip { fill: none; stroke: color-mix(in srgb, var(--text) 22%, transparent); }
.ga-chip-live { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: var(--accent); }
.ga-ring { fill: none; stroke: var(--accent); stroke-width: 1.2; }
.ga-ring-warn { fill: none; stroke: var(--warn); stroke-width: 1.2; }
.ga-key-bed { fill: var(--accent); }
.ga-key { fill: none; stroke: var(--bg); stroke-width: 1.5; stroke-linecap: round; }
.ga-caret { fill: var(--text); }
.ga-on-accent { fill: var(--bg); }
.ga-glyph { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.ga-ping { transform-box: fill-box; transform-origin: center; animation: ga-ping 2.4s ease-out infinite; }
.ga-ping-2 { animation-delay: 1.2s; }
@keyframes ga-ping {
  from { transform: scale(0.5); opacity: 0.9; }
  to { transform: scale(2.4); opacity: 0; }
}
.ga-flow { stroke-dasharray: 4 4; animation: ga-flow 0.9s linear infinite; }
@keyframes ga-flow { to { stroke-dashoffset: -8; } }
.ga-blink { animation: ga-blink 1.1s steps(1) infinite; }
@keyframes ga-blink { 50% { opacity: 0; } }
.ga-pop { transform-box: fill-box; transform-origin: center; animation: ga-pop 420ms cubic-bezier(0.22, 1, 0.36, 1) 500ms both; }
@keyframes ga-pop { from { transform: scale(0.8); opacity: 0; } }
.ga-travel { animation: ga-travel 5s ease-in-out infinite; }
@keyframes ga-travel {
  0%, 30% { transform: translate(246px, 96px); opacity: 0; }
  34% { opacity: 1; }
  39% { transform: translate(234.5px, 73.5px); }
  47.5% { transform: translate(220px, 66px); }
  56% { transform: translate(205.5px, 73.5px); }
  61% { opacity: 1; }
  65%, 100% { transform: translate(194px, 96px); opacity: 0; }
}
.ga-travel-low { animation: ga-travel-low 5s ease-in-out infinite; }
@keyframes ga-travel-low {
  0%, 30% { transform: translate(246px, 120px); opacity: 0; }
  34% { opacity: 1; }
  39% { transform: translate(234.5px, 97.5px); }
  47.5% { transform: translate(220px, 90px); }
  56% { transform: translate(205.5px, 97.5px); }
  61% { opacity: 1; }
  65%, 100% { transform: translate(194px, 120px); opacity: 0; }
}
.ga-swap-out { animation: ga-swap-out 5s ease infinite; }
.ga-swap-in { opacity: 0; animation: ga-swap-in 5s ease infinite; }
@keyframes ga-swap-out { 0%, 64% { opacity: 1; } 70%, 94% { opacity: 0; } 100% { opacity: 1; } }
@keyframes ga-swap-in { 0%, 64% { opacity: 0; } 70%, 94% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .ga-ping { animation: none; opacity: 0; }
  .ga-flow { animation: none; }
  .ga-blink { animation: none; }
  .ga-pop { animation: none; }
  .ga-travel, .ga-travel-low { animation: none; }
  .ga-swap-out { animation: none; opacity: 0; }
  .ga-swap-in { animation: none; opacity: 1; }
}</style><rect x="14" y="20" width="232" height="160" rx="10" class="ga-screen"></rect><text x="28" y="44" class="ga-t ga-strong">Claude accounts</text><path d="M7 2.2v9.6M2.2 7h9.6" transform="translate(196 37)" class="ga-glyph"></path><path d="M3.3 10.7L10.7 3.3M5.2 3.3h5.5v5.5" transform="translate(220 37)" class="ga-glyph"></path><line x1="14" y1="56" x2="246" y2="56" class="ga-line"></line><circle cx="31" cy="74" r="3" class="ga-ok"></circle><text x="40" y="78" class="ga-t ga-mono">work@team.dev</text><text x="40" y="94" class="ga-s ga-ok">working</text><g><text x="28" y="118" class="ga-s">5h</text><rect x="50" y="113" width="96" height="4" rx="2" class="ga-track"></rect><rect x="50" y="113" width="23.04" height="4" rx="2" class="ga-accent"></rect><text x="176" y="118" class="ga-s ga-accent" text-anchor="end">24%</text></g><g><text x="28" y="136" class="ga-s">7d</text><rect x="50" y="131" width="96" height="4" rx="2" class="ga-track"></rect><rect x="50" y="131" width="58.56" height="4" rx="2" class="ga-accent"></rect><text x="176" y="136" class="ga-s ga-accent" text-anchor="end">61%</text></g><rect x="190" y="66" width="44" height="18" rx="9" class="ga-accent"></rect><text x="212" y="78" class="ga-s ga-on-accent" text-anchor="middle">active</text><line x1="14" y1="144" x2="246" y2="144" class="ga-line"></line><circle cx="31" cy="162" r="3" class="ga-ok"></circle><text x="40" y="166" class="ga-t ga-mono">personal@me.dev</text><text x="40" y="182" class="ga-s ga-ok">signed in</text><rect x="188" y="154" width="46" height="18" rx="9" class="ga-chip"></rect><text x="211" y="166" class="ga-s" text-anchor="middle">switch</text><path d="M214 166l0 13 3.4-3 2.4 5.2 2-.9-2.4-5.1 4.6-.2z" class="ga-pointer"></path><path d="M250 44C270 44 262 78 282 78" class="ga-arc"></path><path d="M277 74l5 4-5 4" class="ga-arrow"></path><text x="284" y="53" class="ga-cap">ANOTHER MACHINE</text><rect x="282" y="62" width="144" height="64" rx="10" class="ga-screen"></rect><g class="ga-pop"><circle cx="299" cy="88" r="3" class="ga-ok"></circle><text x="308" y="92" class="ga-t ga-mono">work@team.dev</text><text x="308" y="108" class="ga-s ga-ok">shared here</text></g></svg>