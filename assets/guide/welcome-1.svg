<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" role="img" aria-label="Sessions waiting on you lead the session list, under Needs you." class="guide-art" viewBox="0 0 440 200"><style>:root{--bg:#0b0c10;--bg-soft:#0f1116;--panel:#14161b;--line:#1f2229;--line-soft:#1a1c22;--text:#d8dae0;--pixel-metal-light:#cbd5e1;--pixel-metal-shadow:#64748b;--pixel-metal-edge:#475569;--pixel-character-body:#38bdf8;--text-secondary:#9aa0ab;--provider-claude:#e5a181;--provider-codex:#aab5ff;--ctl-fill:color-mix(in srgb, var(--text) 7%, transparent);--ctl-edge:color-mix(in srgb, var(--text) 50%, transparent);--chrome-bg:color-mix(in srgb, var(--panel) 60%, var(--bg));--chrome-edge:color-mix(in srgb, var(--line) 60%, var(--bg));--sm-edge:color-mix(in srgb, var(--text) 36%, transparent);--sm-fill:color-mix(in srgb, var(--text) 5%, transparent);--accent-16:color-mix(in srgb, var(--accent) 16%, transparent);--err-12:color-mix(in srgb, var(--err) 12%, transparent);--muted-30:color-mix(in srgb, var(--muted) 30%, transparent);--secondary-30:color-mix(in srgb, var(--text-secondary) 30%, transparent);--warn-35:color-mix(in srgb, var(--warn) 35%, transparent);--inflight-30:color-mix(in srgb, var(--inflight) 30%, transparent);--dock:color-mix(in srgb, var(--panel) 40%, var(--bg));--scrim:#00000052;--selected:color-mix(in srgb, var(--text) 8%, var(--panel));--sunken:color-mix(in srgb, var(--bg) 90%, #000000);--your-message:color-mix(in srgb, var(--accent) 14%, var(--panel));--muted:#7e828c;--muted-dim:#50535b;--text-dim:#7e828c;--accent:#7dd3fc;--accent-dim:#38bdf850;--ok:#86efac;--warn:#fcd34d;--err:#fca5a5;--inflight:#f0abfc;--shadow-1:0 6px 18px rgba(0,0,0,0.25);--shadow-2:0 10px 24px rgba(0,0,0,0.32);--shadow-contact:0 1px 2px rgba(0,0,0,0.30);--shadow-overlay:0 16px 40px rgba(0,0,0,0.45);--node-grad:linear-gradient(180deg, var(--panel), var(--bg-soft));--burst-live-wash:linear-gradient(180deg, rgba(240,171,252,0.10), rgba(125,211,252,0.05));--hero-core:radial-gradient(circle at 30% 30%, #c4b5fd, #7dd3fc 55%, #14161b);--live-bloom:color-mix(in srgb, var(--ok) 24%, transparent);--glint:var(--text);--grid-line:#1a1d24;--minimap-mask:rgba(11,12,16,0.85);--mcp-dot-l:65%;--cat-file:#7dd3fc;--cat-shell:#fcd34d;--cat-web:#67e8f9;--cat-agent:#f9a8d4;--cat-task:#86efac;--cat-plan:#c4b5fd;--cat-mcp:#5eead4;--cat-other:#94a3b8}svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg)}.guide-art { display: block; width: 100%; height: auto; overflow: visible; }
.guide-stage > .guide-art { height: 100%; }
.ga-screen { fill: var(--panel); stroke: color-mix(in srgb, var(--text) 16%, transparent); }
.ga-canvas { fill: none; stroke: color-mix(in srgb, var(--text) 16%, transparent); stroke-dasharray: 3 5; }
.ga-line { stroke: color-mix(in srgb, var(--text) 12%, transparent); }
.ga-track { fill: color-mix(in srgb, var(--text) 12%, transparent); }
.ga-bed-warn { fill: color-mix(in srgb, var(--warn) 10%, transparent); }
.ga-t { font-size: calc(11px + var(--ui-text-increase, 0px)); fill: var(--text); }
.ga-s { font-size: calc(11px + max(-1px, var(--ui-text-increase, 0px))); fill: var(--muted); }
.ga-cap { font-size: calc(11px + max(0px, var(--ui-text-increase, 0px))); font-weight: 600; letter-spacing: 0.06em; fill: var(--muted); }
.ga-strong { font-weight: 600; }
.ga-mono { font-family: var(--font-mono); }
.ga-ok { fill: var(--ok); }
.ga-warn { fill: var(--warn); }
.ga-accent { fill: var(--accent); }
.ga-flight { fill: var(--inflight); }
.ga-dim { fill: var(--muted-dim); }
.ga-switch { fill: var(--ctl-fill); stroke: var(--ctl-edge); }
.ga-switch-on { fill: var(--accent); }
.ga-knob { fill: var(--muted); }
.ga-knob-on { fill: var(--bg); }
.ga-box { fill: none; stroke: var(--muted); }
.ga-tick { fill: none; stroke: var(--bg); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ga-pointer { fill: var(--text); stroke: var(--bg); stroke-width: 1; stroke-linejoin: round; }
.ga-pill-warn { fill: none; stroke: var(--warn); }
.ga-off { stroke: var(--muted-dim); stroke-width: 1.2; stroke-dasharray: 2 5; }
.ga-arc { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-dasharray: 3 4; }
.ga-arrow { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.ga-edge { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.ga-edge-done { fill: none; stroke: var(--muted-dim); stroke-width: 1.2; }
.ga-chip { fill: none; stroke: color-mix(in srgb, var(--text) 22%, transparent); }
.ga-chip-live { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: var(--accent); }
.ga-ring { fill: none; stroke: var(--accent); stroke-width: 1.2; }
.ga-ring-warn { fill: none; stroke: var(--warn); stroke-width: 1.2; }
.ga-key-bed { fill: var(--accent); }
.ga-key { fill: none; stroke: var(--bg); stroke-width: 1.5; stroke-linecap: round; }
.ga-caret { fill: var(--text); }
.ga-glyph { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.ga-stripe { fill: var(--panel); stroke: var(--line); }
.ga-sel { fill: var(--selected); }
.ga-door { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.ga-door-on { fill: none; stroke: var(--text); stroke-width: 1.2; }
.ga-card-warn { fill: var(--panel); stroke: var(--warn); }
.ga-card-flight { fill: var(--panel); stroke: color-mix(in srgb, var(--inflight) 70%, transparent); }
.ga-card-on { fill: var(--panel); stroke: var(--accent); stroke-width: 1.6; }
.ga-pane-on { fill: var(--panel); stroke: var(--accent); stroke-width: 1.4; }
.ga-term { fill: var(--bg); }
.ga-btn { fill: var(--ctl-fill); stroke: var(--ctl-edge); }
.ga-ghost { fill: color-mix(in srgb, var(--accent) 6%, transparent); stroke: var(--accent); stroke-dasharray: 3 4; }
.ga-frame { fill: none; stroke: var(--line-soft); }
.ga-quiet { opacity: 0.55; }
.ga-ping { transform-box: fill-box; transform-origin: center; animation: ga-ping 2.4s ease-out infinite; }
.ga-ping-2 { animation-delay: 1.2s; }
@keyframes ga-ping {
  from { transform: scale(0.5); opacity: 0.9; }
  to { transform: scale(2.4); opacity: 0; }
}
.ga-flow { stroke-dasharray: 4 4; animation: ga-flow 0.9s linear infinite; }
@keyframes ga-flow { to { stroke-dashoffset: -8; } }
.ga-blink { animation: ga-blink 1.1s steps(1) infinite; }
@keyframes ga-blink { 50% { opacity: 0; } }
.ga-pop { transform-box: fill-box; transform-origin: center; animation: ga-pop 420ms var(--ease) 500ms both; }
@keyframes ga-pop { from { transform: scale(0.8); opacity: 0; } }
.ga-travel { animation: ga-travel 5s ease-in-out infinite; }
@keyframes ga-travel {
  0%, 30% { transform: translate(246px, 96px); opacity: 0; }
  34% { opacity: 1; }
  39% { transform: translate(234.5px, 73.5px); }
  47.5% { transform: translate(220px, 66px); }
  56% { transform: translate(205.5px, 73.5px); }
  61% { opacity: 1; }
  65%, 100% { transform: translate(194px, 96px); opacity: 0; }
}
.ga-swap-out { animation: ga-swap-out 5s ease infinite; }
.ga-swap-in { opacity: 0; animation: ga-swap-in 5s ease infinite; }
@keyframes ga-swap-out { 0%, 64% { opacity: 1; } 70%, 94% { opacity: 0; } 100% { opacity: 1; } }
@keyframes ga-swap-in { 0%, 64% { opacity: 0; } 70%, 94% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .ga-ping { animation: none; opacity: 0; }
  .ga-flow { animation: none; }
  .ga-blink { animation: none; }
  .ga-pop { animation: none; }
  .ga-travel { animation: none; }
  .ga-swap-out { animation: none; opacity: 0; }
  .ga-swap-in { animation: none; opacity: 1; }
}</style><rect x="14" y="14" width="86" height="172" rx="6" class="ga-stripe"></rect><rect x="17" y="24" width="80" height="17" rx="4" class="ga-sel"></rect><rect x="23" y="28.5" width="8" height="8" rx="2" class="ga-door-on"></rect><text x="37" y="36" class="ga-t">Sessions</text><rect x="23" y="49.5" width="8" height="8" rx="2" class="ga-door"></rect><text x="37" y="57" class="ga-s">Accounts</text><rect x="108" y="14" width="190" height="172" rx="8" class="ga-screen"></rect><text x="120" y="34" class="ga-t ga-strong">Sessions</text><line x1="108" y1="44" x2="298" y2="44" class="ga-line"></line><text x="120" y="62" class="ga-s ga-strong ga-warn">Needs you</text><text x="286" y="62" class="ga-s" text-anchor="end">1</text><rect x="114" y="69" width="178" height="38" rx="6" class="ga-bed-warn"></rect><circle cx="127" cy="83" r="7" class="ga-ring-warn ga-ping"></circle><circle cx="127" cy="83" r="3.5" class="ga-warn"></circle><text x="138" y="87" class="ga-t">api-server</text><text x="138" y="101" class="ga-s ga-warn">waiting 6m · Bash</text><text x="120" y="126" class="ga-s ga-strong">Working</text><text x="286" y="126" class="ga-s" text-anchor="end">1</text><circle cx="127" cy="141" r="3.5" class="ga-flight"></circle><text x="138" y="145" class="ga-t">docs-site</text><text x="120" y="164" class="ga-s ga-strong">Done</text><text x="286" y="164" class="ga-s" text-anchor="end">1</text><circle cx="127" cy="177" r="3.5" class="ga-ok"></circle><text x="138" y="181" class="ga-t">billing</text><rect x="306" y="40" width="120" height="120" rx="10" class="ga-canvas"></rect><rect x="316" y="58" width="100" height="34" rx="6" class="ga-card-warn"></rect><text x="326" y="72" class="ga-t ga-strong">api-server</text><circle cx="329" cy="82" r="2.5" class="ga-warn"></circle><text x="336" y="85.5" class="ga-s ga-warn">Waiting</text><rect x="316" y="104" width="100" height="34" rx="6" class="ga-card-flight"></rect><text x="326" y="118" class="ga-t ga-strong">docs-site</text><circle cx=