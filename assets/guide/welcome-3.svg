<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" role="img" aria-label="Workspace puts up to four sessions side by side. Ctrl+` switches to it." class="guide-art" viewBox="0 0 440 200"><style>:root{--bg:#0b0c10;--bg-soft:#0f1116;--panel:#14161b;--line:#1f2229;--line-soft:#1a1c22;--text:#d8dae0;--pixel-metal-light:#cbd5e1;--pixel-metal-shadow:#64748b;--pixel-metal-edge:#475569;--pixel-character-body:#38bdf8;--text-secondary:#9aa0ab;--provider-claude:#e5a181;--provider-codex:#aab5ff;--ctl-fill:color-mix(in srgb, var(--text) 7%, transparent);--ctl-edge:color-mix(in srgb, var(--text) 50%, transparent);--chrome-bg:color-mix(in srgb, var(--panel) 60%, var(--bg));--chrome-edge:color-mix(in srgb, var(--line) 60%, var(--bg));--sm-edge:color-mix(in srgb, var(--text) 36%, transparent);--sm-fill:color-mix(in srgb, var(--text) 5%, transparent);--accent-16:color-mix(in srgb, var(--accent) 16%, transparent);--err-12:color-mix(in srgb, var(--err) 12%, transparent);--muted-30:color-mix(in srgb, var(--muted) 30%, transparent);--secondary-30:color-mix(in srgb, var(--text-secondary) 30%, transparent);--warn-35:color-mix(in srgb, var(--warn) 35%, transparent);--inflight-30:color-mix(in srgb, var(--inflight) 30%, transparent);--dock:color-mix(in srgb, var(--panel) 40%, var(--bg));--scrim:#00000052;--selected:color-mix(in srgb, var(--text) 8%, var(--panel));--sunken:color-mix(in srgb, var(--bg) 90%, #000000);--your-message:color-mix(in srgb, var(--accent) 14%, var(--panel));--muted:#7e828c;--muted-dim:#50535b;--text-dim:#7e828c;--accent:#7dd3fc;--accent-dim:#38bdf850;--ok:#86efac;--warn:#fcd34d;--err:#fca5a5;--inflight:#f0abfc;--shadow-1:0 6px 18px rgba(0,0,0,0.25);--shadow-2:0 10px 24px rgba(0,0,0,0.32);--shadow-contact:0 1px 2px rgba(0,0,0,0.30);--shadow-overlay:0 16px 40px rgba(0,0,0,0.45);--node-grad:linear-gradient(180deg, var(--panel), var(--bg-soft));--burst-live-wash:linear-gradient(180deg, rgba(240,171,252,0.10), rgba(125,211,252,0.05));--hero-core:radial-gradient(circle at 30% 30%, #c4b5fd, #7dd3fc 55%, #14161b);--live-bloom:color-mix(in srgb, var(--ok) 24%, transparent);--glint:var(--text);--grid-line:#1a1d24;--minimap-mask:rgba(11,12,16,0.85);--mcp-dot-l:65%;--cat-file:#7dd3fc;--cat-shell:#fcd34d;--cat-web:#67e8f9;--cat-agent:#f9a8d4;--cat-task:#86efac;--cat-plan:#c4b5fd;--cat-mcp:#5eead4;--cat-other:#94a3b8}svg{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg)}.guide-art { display: block; width: 100%; height: auto; overflow: visible; }
.guide-stage > .guide-art { height: 100%; }
.ga-screen { fill: var(--panel); stroke: color-mix(in srgb, var(--text) 16%, transparent); }
.ga-canvas { fill: none; stroke: color-mix(in srgb, var(--text) 16%, transparent); stroke-dasharray: 3 5; }
.ga-line { stroke: color-mix(in srgb, var(--text) 12%, transparent); }
.ga-track { fill: color-mix(in srgb, var(--text) 12%, transparent); }
.ga-bed-warn { fill: color-mix(in srgb, var(--warn) 10%, transparent); }
.ga-t { font-size: calc(11px + var(--ui-text-increase, 0px)); fill: var(--text); }
.ga-s { font-size: calc(11px + max(-1px, var(--ui-text-increase, 0px))); fill: var(--muted); }
.ga-cap { font-size: calc(11px + max(0px, var(--ui-text-increase, 0px))); font-weight: 600; letter-spacing: 0.06em; fill: var(--muted); }
.ga-strong { font-weight: 600; }
.ga-mono { font-family: var(--font-mono); }
.ga-ok { fill: var(--ok); }
.ga-warn { fill: var(--warn); }
.ga-accent { fill: var(--accent); }
.ga-flight { fill: var(--inflight); }
.ga-dim { fill: var(--muted-dim); }
.ga-switch { fill: var(--ctl-fill); stroke: var(--ctl-edge); }
.ga-switch-on { fill: var(--accent); }
.ga-knob { fill: var(--muted); }
.ga-knob-on { fill: var(--bg); }
.ga-box { fill: none; stroke: var(--muted); }
.ga-tick { fill: none; stroke: var(--bg); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ga-pointer { fill: var(--text); stroke: var(--bg); stroke-width: 1; stroke-linejoin: round; }
.ga-pill-warn { fill: none; stroke: var(--warn); }
.ga-off { stroke: var(--muted-dim); stroke-width: 1.2; stroke-dasharray: 2 5; }
.ga-arc { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-dasharray: 3 4; }
.ga-arrow { fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.ga-edge { fill: none; stroke: var(--accent); stroke-width: 1.4; }
.ga-edge-done { fill: none; stroke: var(--muted-dim); stroke-width: 1.2; }
.ga-chip { fill: none; stroke: color-mix(in srgb, var(--text) 22%, transparent); }
.ga-chip-live { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: var(--accent); }
.ga-ring { fill: none; stroke: var(--accent); stroke-width: 1.2; }
.ga-ring-warn { fill: none; stroke: var(--warn); stroke-width: 1.2; }
.ga-key-bed { fill: var(--accent); }
.ga-key { fill: none; stroke: var(--bg); stroke-width: 1.5; stroke-linecap: round; }
.ga-caret { fill: var(--text); }
.ga-glyph { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.ga-stripe { fill: var(--panel); stroke: var(--line); }
.ga-sel { fill: var(--selected); }
.ga-door { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.ga-door-on { fill: none; stroke: var(--text); stroke-width: 1.2; }
.ga-card-warn { fill: var(--panel); stroke: var(--warn); }
.ga-card-flight { fill: var(--panel); stroke: color-mix(in srgb, var(--inflight) 70%, transparent); }
.ga-card-on { fill: var(--panel); stroke: var(--accent); stroke-width: 1.6; }
.ga-pane-on { fill: var(--panel); stroke: var(--accent); stroke-width: 1.4; }
.ga-term { fill: var(--bg); }
.ga-btn { fill: var(--ctl-fill); stroke: var(--ctl-edge); }
.ga-ghost { fill: color-mix(in srgb, var(--accent) 6%, transparent); stroke: var(--accent); stroke-dasharray: 3 4; }
.ga-frame { fill: none; stroke: var(--line-soft); }
.ga-quiet { opacity: 0.55; }
.ga-ping { transform-box: fill-box; transform-origin: center; animation: ga-ping 2.4s ease-out infinite; }
.ga-ping-2 { animation-delay: 1.2s; }
@keyframes ga-ping {
  from { transform: scale(0.5); opacity: 0.9; }
  to { transform: scale(2.4); opacity: 0; }
}
.ga-flow { stroke-dasharray: 4 4; animation: ga-flow 0.9s linear infinite; }
@keyframes ga-flow { to { stroke-dashoffset: -8; } }
.ga-blink { animation: ga-blink 1.1s steps(1) infinite; }
@keyframes ga-blink { 50% { opacity: 0; } }
.ga-pop { transform-box: fill-box; transform-origin: center; animation: ga-pop 420ms var(--ease) 500ms both; }
@keyframes ga-pop { from { transform: scale(0.8); opacity: 0; } }
.ga-travel { animation: ga-travel 5s ease-in-out infinite; }
@keyframes ga-travel {
  0%, 30% { transform: translate(246px, 96px); opacity: 0; }
  34% { opacity: 1; }
  39% { transform: translate(234.5px, 73.5px); }
  47.5% { transform: translate(220px, 66px); }
  56% { transform: translate(205.5px, 73.5px); }
  61% { opacity: 1; }
  65%, 100% { transform: translate(194px, 96px); opacity: 0; }
}
.ga-swap-out { animation: ga-swap-out 5s ease infinite; }
.ga-swap-in { opacity: 0; animation: ga-swap-in 5s ease infinite; }
@keyframes ga-swap-out { 0%, 64% { opacity: 1; } 70%, 94% { opacity: 0; } 100% { opacity: 1; } }
@keyframes ga-swap-in { 0%, 64% { opacity: 0; } 70%, 94% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .ga-ping { animation: none; opacity: 0; }
  .ga-flow { animation: none; }
  .ga-blink { animation: none; }
  .ga-pop { animation: none; }
  .ga-travel { animation: none; }
  .ga-swap-out { animation: none; opacity: 0; }
  .ga-swap-in { animation: none; opacity: 1; }
}</style><rect x="176" y="12" width="52" height="18" rx="4" class="ga-chip"></rect><text x="202" y="25" class="ga-s ga-mono" text-anchor="middle">Ctrl+`</text><rect x="236" y="10" width="190" height="22" rx="6" class="ga-btn"></rect><rect x="332" y="12" width="92" height="18" rx="5" class="ga-sel"></rect><text x="284" y="25" class="ga-s" text-anchor="middle">Board</text><text x="378" y="25" class="ga-t" text-anchor="middle">Workspace</text><rect x="14" y="40" width="98" height="150" rx="6" class="ga-stripe"></rect><g><circle cx="27" cy="58" r="2.5" class="ga-warn"></circle><text x="35" y="62" class="ga-s">api-server</text></g><g><circle cx="27" cy="82" r="2.5" class="ga-flight"></circle><text x="35" y="86" class="ga-s">docs-site</text></g><g><circle cx="27" cy="106" r="2.5" class="ga-ok"></circle><text x="35" y="110" class="ga-s">billing</text></g><g><rect x="18" y="120" width="90" height="20" rx="4" class="ga-sel"></rect><circle cx="27" cy="130" r="2.5" class="ga-flight"></circle><text x="35" y="134" class="ga-t">tests</text></g><rect x="120" y="40" width="150" height="72" rx="6" class="ga-pane-on"></rect><text x="129" y="55" class="ga-s ga-mono">1</text><circle cx="144" cy="51" r="2.5" class="ga-warn"></circle><text x="151" y="55" class="ga-t ga-strong">api-server</text><line x1="120" y1="62" x2="270" y2="62" class="ga-line"></line><rect x="129" y="70" width="92.4" height="4" rx="2" class="ga-track"></rect><rect x="129" y="80" width="59.4" height="4" rx="2" class="ga-track"></rect><rect x="129" y="90" width="108.24" height="4" rx="2" class="ga-track"></rect><rect x="276" y="40" width="150" height="72" rx="6" class="ga-screen"></rect><text x="285" y="55" class="ga-s ga-mono">2</text><circle cx="300" cy="51" r="2.5" class="ga-flight"></circle><text x="307" y="55" class="ga-t ga-strong">docs-site</text><line x1="276" y1="62" x2="426" y2="62" class="ga-line"></line><rect x="285" y="70" width="72.6" height="4" rx="2" class="ga-track"></rect><rect x="285" y="80" width="