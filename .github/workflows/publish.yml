name: ci

# Still .github/workflows/publish.yml: global-alias-name.test.ts reads this file
# by that exact path to assert that ccdeck, and nothing else, is what gets
# published — so the filename is load-bearing even though the workflow now does
# more than publish.
#
# Two jobs, one workflow, because the gate has to be a real one: `publish`
# declares `needs: test`, which is the only construct that makes a matrix leg
# able to *stop* a release. A separate workflow could report the same red X and
# publish anyway.
#
#   test     — every push to main, every pull request, and every tag.
#   publish  — tags (v1.1.0, v1.1.1, v2.0.0, …) and manual dispatch only. The
#              tag must match the version in package.json; the job verifies
#              this and aborts on mismatch so you can't accidentally publish
#              1.1.0 from a 1.0.x branch.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
  # Also allow a manual run from the Actions tab — handy for re-publishing
  # after a transient npm outage. Picks up the version from package.json.
  # Still runs `test` first: a publish that can skip the suite is not gated.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── The gate ────────────────────────────────────────────────────────────
  # Three legs, because this suite does not test the same thing on all three.
  #
  #   ubuntu-latest   the 18 sites gated `skipIf(process.platform === "win32")`
  #                   run here, plus the `runIf(posix)` family — the widest
  #                   coverage of the three. That number is not something a
  #                   reader has to take on trust: skip-gate-inventory.test.ts
  #                   reads it back out of this file and fails if it has drifted
  #                   from src/web/__tests__/skip-gates.mjs, the register the
  #                   whole suite is checked against. It said 17 here until
  #                   #585, because #532 deleted two of them along with
  #                   ccdeck-stub-exit.test.ts and nothing was watching.
  #   windows-latest  the whole reason for the matrix. Those sites are *skipped*
  #                   here — 37 skipped cases in all — together with the
  #                   `runIf(posix)` family and sound-hook-park's read-only
  #                   directory case, whose probe cannot block a write on
  #                   Windows. Windows is where this repo's recurring bugs live:
  #                   .cmd shim resolution, cmd.exe quoting, kill-tree, atomic
  #                   rename. It used to be the only leg that ran the drive-colon
  #                   case in cc-project-slug.test.ts, which was gated
  #                   `skipIf(process.platform !== "win32")`; #585 un-gated it —
  #                   it compares tails like its three siblings now — so that
  #                   rule is checked on all three legs and this leg no longer
  #                   holds a case no other leg can reach.
  #   macos-latest    the account machinery is macOS-specific — cswap reads
  #                   the Keychain item `Claude Code-credentials` — and macOS
  #                   is the only leg with a case-insensitive filesystem, so
  #                   it is the only one that can catch a path-casing bug.
  #                   It is also the platform the repo is developed on, which
  #                   is an argument for *keeping* it: a contributor or an
  #                   agent working from Linux otherwise gets no signal at all
  #                   on the platform the maintainer actually ships from.
  #
  # Runner minutes on GitHub-hosted runners are free for public repositories
  # on every OS, so there is no budget argument for trimming a leg.
  # No explicit `name:` — a constant one would label all three legs identically
  # and make them indistinguishable as required status checks. The default
  # gives `test (ubuntu-latest)`, `test (windows-latest)`, `test (macos-latest)`.
  test:
    strategy:
      # One platform's failure must not cancel the others. Without this, a
      # Windows break hides whether Linux was fine, and the first thing you
      # want on a red matrix is to know how far the damage reaches.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A safety net against a hung child process, not a flake allowance. The
    # suite is ~1 minute on a dev machine; 20 leaves generous headroom while
    # still killing a wedged run long before the 6-hour default.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 22, not 20. Node 20 reached end of life on 2026-04-30, so the suite was
      # proving the deck works on a runtime nobody should be running and on no
      # runtime anyone is. 22 is supported to 2027-04-30 and is the floor
      # `node:sqlite` needs — the reader Browser Watch uses on every machine
      # that has it, and a branch this matrix could not otherwise reach.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Built before the suite on purpose. theme-first-paint.test.ts asserts
      # the bootstrap script survives Vite's HTML transform *in the real
      # artifact*, and skips itself when dist/web/index.html is absent — so
      # without this step that assertion silently disappears, which is the
      # same class of problem as the missing test job itself.
      - name: Build web bundle
        run: npm run build

      # Vite transpiles TypeScript with esbuild, which STRIPS types without
      # checking them — so a green `npm run build` says nothing about type
      # correctness and `"strict": true` was enforced only by whoever
      # remembered to type the command. The script existed and passed; no job
      # ran it. Same class as the endpoint probe below: a check nothing invokes
      # is a check that cannot fail.
      - name: Typecheck
        run: npm run typecheck

      # `npm test` verbatim, so CI runs what a contributor runs, plus a JSON
      # report on the side for the assertion below. The default reporter still
      # prints to the log as usual.
      - name: Run tests
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-report.json

      # #376's sharpest point, generalised by #585.
      #
      # The first version of this step looked up ONE test by title — the
      # drive-colon case in cc-project-slug.test.ts, then the only case gated
      # `skipIf(process.platform !== "win32")` — and failed if vitest said
      # anything other than `passed`, because "skipped" and "passed" are both
      # green and a Windows leg could report success while the one case the
      # Windows leg existed for carried on never running.
      #
      # That reasoning was right; the aim was one title too narrow. #585 audited
      # the other twenty-four gate sites against it and found two things. The
      # case this step protected did not need its gate at all — it compares
      # tails like its three siblings now, and runs on every leg, so the title
      # this step used to look up is not skipped anywhere any more. And six
      # gates skip on a RUNTIME PROBE rather than on the platform —
      # `hardLinksWork` at four sites, `readOnlyDirBlocksWrites`, and
      # `existsSync(dist/web/index.html)`. A platform gate cannot lie; a probe
      # can start answering the other way and take its case off ALL THREE legs
      # at once, with a green matrix either side of it. Nothing watched those.
      #
      # So the step asks the general question instead: did the suite run every
      # case it was supposed to, on THIS platform? src/web/__tests__/skip-gates.mjs
      # is the register — every gate site, and when each is expected to skip, as
      # a function of the platform — and skip-gate-inventory.test.ts re-derives
      # the same inventory from the test sources, so a gate added without
      # registering it goes red rather than quiet. No counts live in this file:
      # a number in YAML is a second copy of the register, and the "17" that
      # stood in the comment above for three releases is what a second copy does.
      #
      # Every leg, not only Windows. The probe gates are exactly the ones that
      # vanish everywhere at once, and ubuntu and macOS are where the register
      # expects ZERO skipped cases — the strongest assertion available anywhere
      # in this workflow, and it was not being made.
      #
      # `!cancelled()` rather than the default `success()`: when the suite is
      # red for an unrelated reason, whether the gated cases ran is exactly what
      # you still want to know.
      #
      # The report lands under src/web because vitest resolves --outputFile
      # against its own root, which vite.config.ts sets to src/web.
      - name: Assert every gated case ran where it was supposed to
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            import { pathToFileURL } from "node:url";
            const path = "src/web/vitest-report.json";
            const register = "src/web/__tests__/skip-gates.mjs";
            if (!existsSync(path)) {
              console.log("::error::no vitest report at " + path + " — the suite never got as far as running");
              process.exit(1);
            }
            const { auditReport } = await import(pathToFileURL(register).href);
            const audit = auditReport(JSON.parse(readFileSync(path, "utf8")), process.platform);
            for (const line of audit.lines) console.log(line);
            for (const problem of audit.problems) console.log("::error::" + problem);
            if (!audit.ok) {
              console.log("::error::the suite did not run the cases " + register + " says it should have");
              process.exit(1);
            }
          '

  # ── the floor, proved rather than advertised ────────────────────────────────
  #
  # package.json says `engines: { node: ">=18" }` and the README carries a badge
  # for it, and until this job existed nothing checked either. The matrix above
  # runs Node 22 on all three OSes — deliberately, since that is the floor
  # `node:sqlite` needs — so the oldest runtime this package CLAIMS to support
  # was the one runtime never exercised (#773).
  #
  # What it tests is the claim and not more than the claim: the PACKED artifact,
  # installed the way a user installs it, booted, and asked for four endpoints.
  # Not the vitest suite — that pulls a dev toolchain whose own floor is not this
  # package's promise, and running it here would prove something nobody said.
  #
  # One OS. The matrix already covers the three; what this leg varies is the
  # runtime, and a Node version behaves the same on all of them for the APIs at
  # stake — an absent `node:sqlite`, an absent `zstd` — which are absent by
  # version, never by platform.
  floor:
    name: floor (node 18)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Two Node versions on purpose. The package is BUILT with the toolchain
      # the project actually uses, then RUN on the floor — which is exactly the
      # arrangement a user is in, since they install a published tarball rather
      # than build one.
      - name: Setup Node (build)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No separate build step: `prepack` is `vite build`, so packing produces
      # the same artifact `npm publish` would. And the tarball is FOUND rather
      # than captured — `npm pack --silent` does not silence the hook, so its
      # stdout carries Vite's progress lines as well as the filename, and
      # `TARBALL=$(npm pack --silent)` wrote all of it into $GITHUB_ENV and
      # failed with `Invalid format 'transforming...'`. The first run of this
      # job found that; the deck on Node 18 was never reached.
      - name: Pack
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          echo "TARBALL=$(ls "$RUNNER_TEMP"/*.tgz)" >> "$GITHUB_ENV"

      - name: Setup Node (floor)
        uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Install the packed artifact and boot it
        shell: bash
        run: |
          set -euo pipefail
          node --version
          WORK="$(mktemp -d)"; HOME_DIR="$(mktemp -d)"
          cd "$WORK"
          echo '{"name":"floor-smoke","version":"1.0.0","private":true}' > package.json
          npm install "$TARBALL" --no-audit --no-fund --loglevel=error

          # Nothing installed, no registry asked: this leg is about the runtime,
          # not the network, and a flaky download must not read as a bad floor.
          export HOME="$HOME_DIR" USERPROFILE="$HOME_DIR"
          export CLAUDE_CONFIG_DIR="$HOME_DIR/claude" CODEX_HOME="$HOME_DIR/codex"
          export AGENTS_DECK_NO_INSTALL=1 AGENTS_DECK_NO_DOWNLOAD=1

          node node_modules/ccdeck/bin/agent-dag.js --port 4351 --no-open > deck.log 2>&1 &
          DECK=$!
          trap 'kill "$DECK" 2>/dev/null || true' EXIT

          for _ in $(seq 1 300); do
            curl -fsS -o /dev/null -m 2 http://127.0.0.1:4351/ 2>/dev/null && break
            sleep 0.2
          done

          # THE ENDPOINTS, AND THE ONE THAT MAKES THEM MEAN ANYTHING.
          #
          # This loop used to ask for /api/state, which has never been a route —
          # the string appeared exactly once in the repo, on this line. It
          # reported 200 because an unmatched GET fell through to the SPA shell,
          # and so would the other three if the whole route table were deleted.
          # The server answers an unmatched /api/ path with 404 now, so a status
          # code here is evidence again; the content-type check keeps it that
          # way if that ever regresses, and the negative probe below is the
          # assertion that the route table is alive at all rather than that one
          # static file is.
          #
          # All three are reads that stay open by design — the guarded ones
          # answer 401 to a curl with no browser headers and no token, which is
          # correct and would make a 200 here the wrong thing to assert.
          fail=0
          for ep in /api/health /api/system /api/version; do
            read -r code ctype <<<"$(curl -s -o /dev/null -m 30 -w '%{http_code} %{content_type}' "http://127.0.0.1:4351$ep")"
            printf '  %-20s %s %s\n' "$ep" "$code" "$ctype"
            [ "$code" = "200" ] || fail=1
            case "$ctype" in application/json*) ;; *) echo "::error::$ep did not answer with JSON"; fail=1 ;; esac
          done
          missing="$(curl -s -o /dev/null -m 30 -w '%{http_code}' "http://127.0.0.1:4351/api/definitely-not-a-route")"
          printf '  %-20s %s (want 404)\n' "/api/<nonexistent>" "$missing"
          [ "$missing" = "404" ] || { echo "::error::an unmatched /api path did not 404 — a status probe here proves nothing"; fail=1; }

          # A runtime too old for something the deck reaches for does not show up
          # as a non-200: every such path is written to degrade rather than
          # throw. So the proof that it degraded is that nothing was thrown.
          if grep -qiE "is not a function|is not defined|ERR_[A-Z_]+|Cannot find module" deck.log; then
            echo "--- the deck complained on the floor runtime ---"
            cat deck.log
            fail=1
          fi

          [ "$fail" = "0" ] && echo "floor ok on $(node --version)"
          exit "$fail"

  # ── the types, actually checked ─────────────────────────────────────────────
  #
  # `npm run build` is `vite build`, and Vite transpiles TypeScript with esbuild,
  # which STRIPS types without checking them. A type error does not fail the
  # build; it produces a working bundle with a hole in it. So until this job
  # existed the green matrix said nothing at all about type correctness, and the
  # `"strict": true` in tsconfig.json was enforced only by whoever remembered to
  # type `npm run typecheck` before pushing (#961).
  #
  # That is the same shape as the skip-gate problem the `test` job reasons about
  # at length above, one step earlier: there, a check that could quietly stop
  # running; here, a check that never started. A script nothing invokes is not a
  # guarantee, it is a suggestion.
  #
  # ONE LEG, not a fourth column on the matrix. `tsc` reads the same sources and
  # the same tsconfig on all three operating systems and answers identically —
  # nothing in this project's types is conditioned on the platform — so running
  # it three times buys nothing and costs a wait. Running it on its own also
  # makes it fail FAST: a type error is reported in well under a minute instead
  # of behind the slowest leg of a matrix that builds and boots.
  #
  # Node 22, matching the other jobs deliberately: node-floor.test.ts reads every
  # `node-version:` in this file back out and compares the set against
  # `engines.node` and its registered gap, so a different version here would be a
  # finding there rather than a free choice.
  #
  # WHAT IT CHECKS is tsconfig.build.json — `src/web` minus `src/web/__tests__` —
  # and that narrowness is a stated choice, not a leftover. The suite imports the
  # server's untyped `.mjs` modules behind `@ts-expect-error`, so checking it
  # produces ~200 TS7016s that say nothing about the app; vite.config.ts is out
  # for a duller reason spelled out in that file. The tests are checked by being
  # run, which is the job above.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No build step. `tsc --noEmit` reads sources, not artifacts, and the point
      # of this job is precisely that the build cannot answer the question.
      - name: Typecheck
        run: npm run typecheck

  # ── The release ─────────────────────────────────────────────────────────
  publish:
    # Every leg, and every gate. `needs` on a matrix job waits for all of its
    # legs and requires all of them to have succeeded, so a red Windows leg
    # blocks the release even though fail-fast: false let the other two finish —
    # and `typecheck` is in the list for the same reason the other two are: a
    # check that cannot stop a publish is a check the publish does not have.
    needs: [test, floor, typecheck]
    # The workflow now runs on pushes and pull requests too; this keeps the
    # publish job itself on exactly the two triggers it had before.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for `npm publish --provenance`
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Kept in step with the test job above; see the note there.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Verify tag matches package.json
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "package.json: $PKG_VERSION"
          echo "tag:          $TAG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # `id:` so the Summary can name it. Its condition has to separate "the
      # publish failed" from "the job failed before we got here", and this step
      # is the last one upstream of the publish — it only runs if the tag guard
      # and `npm ci` both passed, so its outcome stands for the whole preamble.
      - name: Build web bundle
        id: build
        run: npm run build

      # ONE NAME. The deck was also published as `agents-deck` and `agent-dag`:
      # first as this tarball renamed, then (from 3.22.3) as small packages
      # that depended on ccdeck. Neither is published any more — ccdeck is the
      # only name, and the two old ones stay on the registry at their last
      # version.
      #
      # A deck running this code under an old name still updates: it asks npm
      # about ccdeck whatever it was installed as (self-update.mjs,
      # registryName); an install sitting inside one of the old packages
      # updates by reinstalling it, and its `ccdeck@^3` dependency then resolves
      # to the newest ccdeck; an `npx agents-deck` run restarts as `npx ccdeck`.
      # A deck already on 3.22.8 under an old name runs the older check, which
      # asks about the frozen name, and stays there until it is reinstalled as
      # ccdeck — accepted, rather than publishing the old names once more.
      #
      # Idempotent — it skips a version already on the registry — so the job is
      # safe to re-run after a token or registry problem.
      - name: Publish to npm (ccdeck)
        id: publish_ccdeck
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # npm view prints the version string if published, empty otherwise
          # (and exits 0 either way for an existing package) — so test the
          # OUTPUT, not the exit code.
          EXISTING=$(npm view "ccdeck@$VERSION" version 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "ccdeck@$VERSION already published — skipping."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The run summary is the first thing anybody looks at after a release, and
      # it used to be the one step in this job that could not tell the truth: it
      # read nothing about what had happened and asserted nothing, so a run that
      # aborted on a tag mismatch still wrote "### Published v1.44.0 🚀" over
      # links that 404. It reads the publish step's outcome now. Gated on the
      # build — with nothing built there is no release to report — and
      # `!cancelled()` so a run whose publish failed still gets its summary,
      # which is the run that needs one most.
      - name: Summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          CCDECK: ${{ steps.publish_ccdeck.outcome }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$CCDECK" = "success" ]; then
            echo "### Published v$VERSION :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- https://www.npmjs.com/package/ccdeck/v/$VERSION" >> $GITHUB_STEP_SUMMARY
          else
            # Failed, or skipped because the job never reached it — named as
            # what it was rather than linked to a page that does not exist.
            echo "### v$VERSION was not published :warning:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- \`ccdeck\` — **$CCDECK**, not published at this version" >> $GITHUB_STEP_SUMMARY
          fi
